<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <rect width="600" height="400" fill="#0B2545" />

  <!-- Construction Crane Silhouette and Scheduling Framework -->
  <!-- Tower Crane Structure -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- Vertical Mast Tower -->
    <line x1="160" y1="60" x2="160" y2="340" />
    <line x1="190" y1="60" x2="190" y2="340" />
    <!-- Mast Bracing Lattice -->
    <line x1="160" y1="90" x2="190" y2="120" />
    <line x1="190" y1="90" x2="160" y2="120" />
    <line x1="160" y1="120" x2="190" y2="150" />
    <line x1="190" y1="120" x2="160" y2="150" />
    <line x1="160" y1="150" x2="190" y2="180" />
    <line x1="190" y1="150" x2="160" y2="180" />
    <line x1="160" y1="180" x2="190" y2="210" />
    <line x1="190" y1="180" x2="160" y2="210" />
    <line x1="160" y1="210" x2="190" y2="240" />
    <line x1="190" y1="210" x2="160" y2="240" />
    <line x1="160" y1="240" x2="190" y2="270" />
    <line x1="190" y1="240" x2="160" y2="270" />
    <line x1="160" y1="270" x2="190" y2="300" />
    <line x1="190" y1="270" x2="160" y2="300" />
    <line x1="160" y1="300" x2="190" y2="330" />
    <line x1="190" y1="300" x2="160" y2="330" />

    <!-- Operator Cab -->
    <rect x="150" y="55" width="25" height="25" fill="#38BDF8" />

    <!-- Jib (Horizontal Arm) & Counter-Jib -->
    <line x1="80" y1="65" x2="480" y2="65" stroke-width="3" />
    <!-- Peak Tower -->
    <polygon points="175,20 160,65 190,65" fill="#1E3A5F" />
    <!-- Pendant Cables -->
    <line x1="175" y1="20" x2="90" y2="65" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="175" y1="20" x2="360" y2="65" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Counterweight -->
    <rect x="85" y="65" width="30" height="20" fill="#E2E8F0" />

    <!-- Hoist Cable & Hook -->
    <line x1="360" y1="65" x2="360" y2="170" stroke="#F59E0B" stroke-width="2" />
    <polygon points="354,170 366,170 360,180" fill="#F59E0B" />
    <!-- Suspended Load (Concrete Bucket) -->
    <polygon points="345,182 375,182 370,210 350,210" fill="#EF4444" />
  </g>

  <!-- Gantt Chart Scheduling Graphic on Right Side -->
  <g transform="translate(390, 190)">
    <rect x="0" y="0" width="180" height="130" rx="6" fill="#102A43" stroke="#243B53" stroke-width="1" />
    <text x="15" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EAF2FF">WBS / CPM SCHEDULE</text>
    <!-- Task bars -->
    <text x="15" y="44" font-family="sans-serif" font-size="8" fill="#94A3B8">Excavation</text>
    <rect x="75" y="37" width="50" height="8" rx="2" fill="#10B981" />

    <text x="15" y="64" font-family="sans-serif" font-size="8" fill="#94A3B8">Substructure</text>
    <rect x="100" y="57" width="60" height="8" rx="2" fill="#3B82F6" />

    <text x="15" y="84" font-family="sans-serif" font-size="8" fill="#94A3B8">Frame (RC)</text>
    <rect x="120" y="77" width="45" height="8" rx="2" fill="#EF4444" />

    <text x="15" y="104" font-family="sans-serif" font-size="8" fill="#94A3B8">Finishes</text>
    <rect x="140" y="97" width="30" height="8" rx="2" fill="#F59E0B" />
  </g>

  <!-- Base Plate & Ground -->
  <line x1="0" y1="340" x2="600" y2="340" stroke="#64748B" stroke-width="2" />
  <rect x="140" y="340" width="70" height="15" fill="#334155" />

  <!-- Bottom Label -->
  <rect x="20" y="365" width="560" height="25" rx="3" fill="#0E2439" stroke="#1E3A5F" stroke-width="1" />
  <text x="30" y="381" font-family="sans-serif" font-size="10" font-weight="600" fill="#EAF2FF">SITE LOGISTICS PLANNING • QUANTITY TAKEOFF • CRITICAL PATH ANALYSIS</text>
</svg>
