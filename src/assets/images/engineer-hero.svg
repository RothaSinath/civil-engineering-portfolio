<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="50%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#gridPattern)" />

  <!-- Construction Frame in Background -->
  <g stroke="#3B82F6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4">
    <line x1="120" y1="80" x2="120" y2="520" />
    <line x1="260" y1="80" x2="260" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" />
    <line x1="540" y1="80" x2="540" y2="520" />
    <line x1="680" y1="80" x2="680" y2="520" />
    <line x1="80" y1="180" x2="720" y2="180" />
    <line x1="80" y1="300" x2="720" y2="300" />
    <line x1="80" y1="420" x2="720" y2="420" />
    <!-- Bracing -->
    <line x1="120" y1="180" x2="260" y2="300" />
    <line x1="260" y1="180" x2="120" y2="300" />
    <line x1="260" y1="300" x2="400" y2="420" />
    <line x1="400" y1="300" x2="260" y2="420" />
    <line x1="540" y1="180" x2="680" y2="300" />
    <line x1="680" y1="180" x2="540" y2="300" />
  </g>

  <!-- Foreground Blueprint Sheet Held by Engineer -->
  <g transform="translate(180, 240)">
    <!-- Drawing board / plan -->
    <rect x="0" y="0" width="440" height="280" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#D9E2EC" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.3))" />
    <!-- Inner technical plan lines -->
    <rect x="25" y="25" width="390" height="230" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5" />
    <!-- Architectural grid inside plan -->
    <line x1="70" y1="50" x2="70" y2="230" stroke="#102A43" stroke-width="2" />
    <line x1="160" y1="50" x2="160" y2="230" stroke="#102A43" stroke-width="2" />
    <line x1="260" y1="50" x2="260" y2="230" stroke="#102A43" stroke-width="2" />
    <line x1="360" y1="50" x2="360" y2="230" stroke="#102A43" stroke-width="2" />
    <line x1="50" y1="90" x2="390" y2="90" stroke="#102A43" stroke-width="2" />
    <line x1="50" y1="150" x2="390" y2="150" stroke="#102A43" stroke-width="2" />
    <line x1="50" y1="210" x2="390" y2="210" stroke="#102A43" stroke-width="2" />

    <!-- Column markers (filled squares) -->
    <rect x="66" y="86" width="8" height="8" fill="#102A43" />
    <rect x="156" y="86" width="8" height="8" fill="#102A43" />
    <rect x="256" y="86" width="8" height="8" fill="#102A43" />
    <rect x="356" y="86" width="8" height="8" fill="#102A43" />
    <rect x="66" y="146" width="8" height="8" fill="#102A43" />
    <rect x="156" y="146" width="8" height="8" fill="#102A43" />
    <rect x="256" y="146" width="8" height="8" fill="#102A43" />
    <rect x="356" y="146" width="8" height="8" fill="#102A43" />

    <!-- Dimension arrows -->
    <path d="M 70 40 L 160 40" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="115" y="35" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle" font-weight="600">6,000 mm</text>
    <text x="210" y="35" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle" font-weight="600">6,500 mm</text>

    <!-- Title block -->
    <rect x="270" y="195" width="140" height="55" fill="#FFFFFF" stroke="#102A43" stroke-width="1" />
    <text x="280" y="212" font-family="sans-serif" font-size="10" font-weight="bold" fill="#102A43">CIVIL STRUCTURAL DWG</text>
    <text x="280" y="226" font-family="sans-serif" font-size="9" fill="#627D98">SCALE: 1:100 | REV: 02</text>
    <text x="280" y="240" font-family="sans-serif" font-size="9" fill="#3B82F6">STATUS: APPROVED FOR CONST.</text>
  </g>

  <!-- Hardhat Silhouette & Safety Gear Element -->
  <g transform="translate(340, 110)">
    <!-- White Hardhat with yellow stripe -->
    <ellipse cx="60" cy="55" rx="55" ry="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 10 55 C 10 25, 110 25, 110 55 Z" fill="#F8FAFC" />
    <path d="M 4 58 C 4 54, 116 54, 116 58 C 116 64, 4 64, 4 58 Z" fill="#E2E8F0" />
    <!-- Ridge on hardhat -->
    <path d="M 52 25 Q 60 20 68 25 L 68 52 Q 60 48 52 52 Z" fill="#3B82F6" />
    <!-- Safety badge -->
    <rect x="45" y="35" width="30" height="8" rx="2" fill="#102A43" />
    <text x="60" y="42" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SAFETY 1ST</text>
  </g>

  <!-- Technical Overlay Elements -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="680" height="40" rx="6" fill="#0B2545" fill-opacity="0.85" stroke="#3B82F6" stroke-width="1" />
    <text x="30" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#EAF2FF">STRUCTURAL ENGINEERING FIELD SURVEY &amp; ON-SITE TECHNICAL REVIEW</text>
    <circle cx="640" cy="20" r="5" fill="#10B981" />
    <text x="630" y="24" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">LIVE SITE ACTIVE</text>
  </g>
</svg>
