<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <rect width="600" height="400" fill="#0E2439" />
  <defs>
    <pattern id="cadGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" stroke="#1E3A5F" stroke-width="0.75" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#cadGrid)" />

  <!-- Architectural Floor Plan Concept -->
  <g transform="translate(60, 45)">
    <!-- Outer Walls (Double Line) -->
    <rect x="20" y="20" width="440" height="260" stroke="#FFFFFF" stroke-width="3" fill="#132B45" />
    <rect x="28" y="28" width="424" height="244" stroke="#94A3B8" stroke-width="1.5" fill="none" />

    <!-- Interior Partition Walls -->
    <line x1="180" y1="28" x2="180" y2="180" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="180" y1="180" x2="320" y2="180" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="320" y1="180" x2="320" y2="272" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Door Swings (Arc & Panel) -->
    <g stroke="#38BDF8" stroke-width="1.5">
      <!-- Door 1 -->
      <line x1="180" y1="80" x2="220" y2="80" />
      <path d="M 220 80 A 40 40 0 0 0 180 120" stroke-dasharray="2 2" fill="none" />
      <!-- Door 2 -->
      <line x1="320" y1="210" x2="320" y2="250" />
      <path d="M 320 250 A 40 40 0 0 0 280 210" stroke-dasharray="2 2" fill="none" />
    </g>

    <!-- Structural Columns (Solid Hatch) -->
    <rect x="18" y="18" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="173" y="18" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="448" y="18" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="18" y="268" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="313" y="268" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="448" y="268" width="14" height="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />

    <!-- Room Labels -->
    <text x="100" y="110" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">OFFICE 01</text>
    <text x="100" y="125" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">A = 24.5 m²</text>

    <text x="250" y="110" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">CONFERENCE</text>
    <text x="250" y="125" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">A = 42.0 m²</text>

    <text x="390" y="190" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">RECEPTION</text>

    <!-- Dimension Strings with Ticks -->
    <line x1="20" y1="5" x2="460" y2="5" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="20" y1="0" x2="20" y2="10" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="180" y1="0" x2="180" y2="10" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="460" y1="0" x2="460" y2="10" stroke="#38BDF8" stroke-width="1.5" />
    <text x="100" y="-2" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">4,800</text>
    <text x="320" y="-2" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">8,400</text>
  </g>

  <!-- Title Block at Bottom Right -->
  <rect x="360" y="325" width="220" height="60" fill="#102A43" stroke="#3B82F6" stroke-width="1" />
  <text x="375" y="345" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">CAD FLOOR PLAN DETAILS</text>
  <text x="375" y="360" font-family="sans-serif" font-size="10" fill="#9FB3C8">DWG NO: CIVE-A-101 | 1:50</text>
  <text x="375" y="375" font-family="sans-serif" font-size="9" fill="#38BDF8">AUTOCAD TECHNICAL STANDARD</text>
</svg>
