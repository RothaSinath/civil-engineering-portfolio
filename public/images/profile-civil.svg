<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgCivilGrad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="50%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#243B53" />
    </linearGradient>
    <linearGradient id="vestGrad" x1="200" y1="360" x2="400" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="260" y1="200" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDDEC0" />
      <stop offset="100%" stop-color="#E5B288" />
    </linearGradient>
    <linearGradient id="helmetGrad" x1="240" y1="110" x2="360" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <pattern id="civilGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3B82F6" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background with Civil Engineering Grid -->
  <rect width="600" height="600" fill="url(#bgCivilGrad)" />
  <rect width="600" height="600" fill="url(#civilGrid)" />

  <!-- Background Structural Framing Silhouettes -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="3 3">
    <line x1="80" y1="40" x2="80" y2="560" />
    <line x1="520" y1="40" x2="520" y2="560" />
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="480" x2="560" y2="480" />
    <!-- Diagonal Truss Bracing -->
    <line x1="80" y1="120" x2="200" y2="280" />
    <line x1="520" y1="120" x2="400" y2="280" />
    <line x1="80" y1="480" x2="200" y2="320" />
    <line x1="520" y1="480" x2="400" y2="320" />
  </g>

  <!-- Circular Technical Frame Halo -->
  <circle cx="300" cy="300" r="230" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  <circle cx="300" cy="300" r="215" stroke="#93C5FD" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.4" fill="none" />

  <!-- Civil Engineer Silhouette & Portrait -->
  <g id="engineer-figure">
    <!-- Blue Collar Shirt / Base -->
    <path d="M 180 540 L 420 540 L 410 420 L 350 370 L 250 370 L 190 420 Z" fill="#1E3A8A" />

    <!-- Safety Vest (High-Visibility Orange with Silver Reflective Stripes) -->
    <path d="M 190 420 L 255 375 L 275 460 L 220 540 L 175 540 Z" fill="url(#vestGrad)" />
    <path d="M 410 420 L 345 375 L 325 460 L 380 540 L 425 540 Z" fill="url(#vestGrad)" />

    <!-- Reflective Safety Bands (Silver with Glow) -->
    <path d="M 200 450 L 270 410 L 265 435 L 195 475 Z" fill="#E2E8F0" />
    <path d="M 400 450 L 330 410 L 335 435 L 405 475 Z" fill="#E2E8F0" />
    <rect x="220" y="500" width="50" height="18" fill="#F1F5F9" />
    <rect x="330" y="500" width="50" height="18" fill="#F1F5F9" />

    <!-- Inner Collar -->
    <polygon points="265,370 300,410 335,370 320,360 280,360" fill="#FFFFFF" />
    <polygon points="295,390 305,390 303,460 297,460" fill="#0F172A" />

    <!-- Neck -->
    <rect x="275" y="300" width="50" height="75" rx="10" fill="url(#skinGrad)" />

    <!-- Head / Face -->
    <ellipse cx="300" cy="260" rx="65" ry="75" fill="url(#skinGrad)" />

    <!-- Hair Silhouette Under Hardhat -->
    <path d="M 235 230 C 235 200, 365 200, 365 230 C 365 240, 360 270, 355 275 C 350 250, 250 250, 245 275 Z" fill="#1E293B" />

    <!-- Ears -->
    <ellipse cx="235" cy="265" rx="8" ry="14" fill="#E5B288" />
    <ellipse cx="365" cy="265" rx="8" ry="14" fill="#E5B288" />

    <!-- Eyebrows & Eyes -->
    <path d="M 260 245 Q 275 240 285 245" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 315 245 Q 325 240 340 245" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="272" cy="255" rx="5" ry="6" fill="#0F172A" />
    <ellipse cx="328" cy="255" rx="5" ry="6" fill="#0F172A" />
    <circle cx="274" cy="253" r="1.5" fill="#FFFFFF" />
    <circle cx="330" cy="253" r="1.5" fill="#FFFFFF" />

    <!-- Nose & Confident Smile -->
    <path d="M 300 252 L 297 275 L 305 277" stroke="#C28860" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 285 292 Q 300 305 315 292" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- White Civil Engineering Hardhat (Safety Helmet) -->
    <!-- Helmet Shell -->
    <path d="M 220 205 C 215 130, 385 130, 380 205 Z" fill="url(#helmetGrad)" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Helmet Brim / Visor -->
    <path d="M 205 205 C 205 198, 395 198, 395 205 C 395 216, 205 216, 205 205 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Center Reinforcement Ridge -->
    <path d="M 292 135 C 295 130, 305 130, 308 135 L 306 200 L 294 200 Z" fill="#3B82F6" />
    <!-- Safety Hardhat Logo / Emplacement -->
    <rect x="288" y="160" width="24" height="14" rx="2" fill="#0B2545" />
    <text x="300" y="170" font-family="sans-serif" font-size="7" font-weight="bold" fill="#38BDF8" text-anchor="middle">CIVIL</text>

    <!-- Blueprints Roll in Hand -->
    <g transform="translate(140, 410) rotate(-25)">
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="15" y1="8" x2="145" y2="8" stroke="#3B82F6" stroke-width="1.5" />
      <line x1="15" y1="18" x2="115" y2="18" stroke="#3B82F6" stroke-width="1.5" />
      <!-- Elastic Rubber Band around roll -->
      <rect x="70" y="0" width="10" height="26" fill="#EF4444" />
    </g>
  </g>

  <!-- Technical Engineering Compass & Level Overlay Bottom Badge -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="400" height="64" rx="14" fill="#0B2545" fill-opacity="0.95" stroke="#3B82F6" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.4))" />
    <!-- Green Status Indicator -->
    <circle cx="30" cy="32" r="6" fill="#10B981" />
    <!-- Candidate Identity & Specialization -->
    <text x="50" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">TY SOPHALLY • CIVIL ENGINEER</text>
    <text x="50" y="47" font-family="sans-serif" font-size="11" font-weight="500" fill="#93C5FD">National University of Battambang • Cambodia</text>
    <!-- Drafting Divider & Badge -->
    <line x1="330" y1="14" x2="330" y2="50" stroke="#334E68" stroke-width="1" />
    <text x="365" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38BDF8" text-anchor="middle">B.ENG.</text>
  </g>
</svg>
