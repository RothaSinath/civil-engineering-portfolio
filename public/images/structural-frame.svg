<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <rect width="600" height="400" fill="#0B2545" />
  <!-- Grid -->
  <defs>
    <pattern id="sGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#243B53" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#sGrid)" />

  <!-- Multi-bay Structural Frame -->
  <g transform="translate(60, 40)">
    <!-- Columns -->
    <rect x="60" y="60" width="16" height="250" fill="#E2E8F0" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="230" y="60" width="16" height="250" fill="#E2E8F0" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="400" y="60" width="16" height="250" fill="#E2E8F0" stroke="#3B82F6" stroke-width="1.5" />

    <!-- Floor Beams -->
    <rect x="40" y="170" width="400" height="16" fill="#CBD5E1" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="40" y="60" width="400" height="16" fill="#CBD5E1" stroke="#3B82F6" stroke-width="1.5" />

    <!-- Support Pin/Fixed symbols at base -->
    <polygon points="58,310 78,310 68,326" fill="#3B82F6" />
    <line x1="50" y1="326" x2="86" y2="326" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="228,310 248,310 238,326" fill="#3B82F6" />
    <line x1="220" y1="326" x2="256" y2="326" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="398,310 418,310 408,326" fill="#3B82F6" />
    <line x1="390" y1="326" x2="426" y2="326" stroke="#FFFFFF" stroke-width="2" />

    <!-- Uniformly Distributed Load (UDL) Arrows on Roof Beam -->
    <g stroke="#EF4444" stroke-width="2">
      <path d="M 68 30 L 68 55 M 65 48 L 68 55 L 71 48" />
      <path d="M 120 30 L 120 55 M 117 48 L 120 55 L 123 48" />
      <path d="M 175 30 L 175 55 M 172 48 L 175 55 L 178 48" />
      <path d="M 238 30 L 238 55 M 235 48 L 238 55 L 241 48" />
      <path d="M 295 30 L 295 55 M 292 48 L 295 55 L 298 48" />
      <path d="M 350 30 L 350 55 M 347 48 L 350 55 L 353 48" />
      <path d="M 408 30 L 408 55 M 405 48 L 408 55 L 411 48" />
      <line x1="68" y1="30" x2="408" y2="30" stroke="#EF4444" stroke-width="2" />
    </g>
    <text x="238" y="22" font-family="sans-serif" font-size="11" fill="#EF4444" text-anchor="middle" font-weight="bold">w = 25 kN/m</text>

    <!-- Bending Moment Curves in Neon Blue -->
    <path d="M 68 178 Q 149 220 230 178" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 238 178 Q 319 220 400 178" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />
    <text x="149" y="210" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">+M_max</text>
    <text x="319" y="210" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">+M_max</text>
  </g>

  <!-- Title Pill -->
  <rect x="20" y="350" width="560" height="32" rx="4" fill="#102A43" stroke="#334E68" stroke-width="1" />
  <text x="35" y="371" font-family="sans-serif" font-size="12" font-weight="600" fill="#EAF2FF">2D MULTI-SPAN PORTAL FRAME ANALYSIS • MOMENT DISTRIBUTION</text>
</svg>
