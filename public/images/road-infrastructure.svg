<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <rect width="600" height="400" fill="#0B2545" />

  <!-- Road Cross Section & Geometry Representation -->
  <!-- Natural Ground Line (dashed) -->
  <path d="M 0 280 Q 200 290 300 270 T 600 290" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <text x="40" y="270" font-family="sans-serif" font-size="10" fill="#64748B">Existing Ground Level (EGL)</text>

  <!-- Road Embankment (Cut & Fill Fill Slope) -->
  <polygon points="50,285 120,200 480,200 550,285" fill="#1E3A5F" stroke="#334E68" stroke-width="2" />

  <!-- Subbase & Base Course -->
  <polygon points="125,200 475,200 470,215 130,215" fill="#475569" />
  <polygon points="130,215 470,215 465,230 135,230" fill="#334155" />

  <!-- Asphalt Pavement Surface with Crown / Camber -->
  <polygon points="130,195 300,190 470,195 475,200 125,200" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Centerline White Dashes (Road Crown) -->
  <line x1="300" y1="180" x2="300" y2="200" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 2" />
  <text x="300" y="172" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F59E0B" text-anchor="middle">CL ℄</text>

  <!-- Cross Slope Arrows (2.0% Camber) -->
  <g stroke="#38BDF8" stroke-width="1.5">
    <line x1="220" y1="184" x2="160" y2="187" />
    <line x1="380" y1="184" x2="440" y2="187" />
  </g>
  <text x="210" y="178" font-family="sans-serif" font-size="9" fill="#38BDF8">e = 2.0%</text>
  <text x="390" y="178" font-family="sans-serif" font-size="9" fill="#38BDF8">e = 2.0%</text>

  <!-- Drainage Ditches (V-shape) -->
  <polyline points="20,280 50,285 70,305 100,285" stroke="#38BDF8" stroke-width="2" fill="none" />
  <polyline points="500,285 530,305 550,285 580,280" stroke="#38BDF8" stroke-width="2" fill="none" />
  <text x="70" y="325" font-family="sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">Side Ditch</text>
  <text x="530" y="325" font-family="sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">Side Ditch</text>

  <!-- Dimension Indicator for Carriage Way Width -->
  <line x1="130" y1="140" x2="470" y2="140" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="130" y1="135" x2="130" y2="145" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="300" y1="135" x2="300" y2="145" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="470" y1="135" x2="470" y2="145" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="215" y="132" font-family="sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Lane 1 (3.50m)</text>
  <text x="385" y="132" font-family="sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Lane 2 (3.50m)</text>

  <!-- Bottom Technical Banner -->
  <rect x="20" y="350" width="560" height="32" rx="4" fill="#102A43" stroke="#243B53" stroke-width="1" />
  <text x="35" y="371" font-family="sans-serif" font-size="11" font-weight="600" fill="#EAF2FF">HIGHWAY CROSS-SECTION • 2-LANE RURAL ARTERIAL • AASHTO COMPLIANT</text>
</svg>
